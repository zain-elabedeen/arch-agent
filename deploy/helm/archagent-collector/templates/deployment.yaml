apiVersion: apps/v1
kind: Deployment
metadata:
  name: archagent-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: archagent-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: archagent-collector
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ required "image.tag or image.digest is required" .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ARCHAGENT_COLLECTOR_INGEST_ENDPOINT
              value: {{ .Values.registration.endpoint | quote }}
            - name: ARCHAGENT_COLLECTOR_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: archagent-registration
                  key: token
            - name: ARCHAGENT_K8S_INCLUDE_NAMESPACES
              value: {{ join "," .Values.collection.includeNamespaces | quote }}
            - name: ARCHAGENT_K8S_EXCLUDE_NAMESPACES
              value: {{ join "," .Values.collection.excludeNamespaces | quote }}
            - name: ARCHAGENT_LOGS_ENABLED
              value: {{ .Values.collection.logsEnabled | quote }}
            - name: ARCHAGENT_COLLECTOR_CREDENTIAL_FILE
              value: /var/lib/archagent/credential
            - name: ARCHAGENT_COLLECTOR_RETRY_QUEUE_FILE
              value: /var/lib/archagent/retry-queue.json
          resources:
{{ toYaml .Values.resources | indent 12 }}
          livenessProbe:
            exec:
              command: ["python", "-c", "import agent.app.connectors.hosted_orchestrator"]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["python", "-c", "from pathlib import Path; raise SystemExit(0 if Path('/var/lib/archagent/credential').exists() else 1)"]
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: credential
              mountPath: /var/lib/archagent
      volumes:
        - name: credential
          persistentVolumeClaim:
            claimName: archagent-collector-credential
