services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: archagent
      POSTGRES_USER: archagent
      POSTGRES_PASSWORD: archagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archagent -d archagent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ARCHAGENT_POSTGRES_DSN: postgresql+psycopg://archagent:archagent@postgres:5432/archagent
      ARCHAGENT_K8S_AUTO_MIGRATE: "true"
      GOOGLE_CLOUD_QUOTA_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    command: ["uvicorn", "agent.app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  ingestion-worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ARCHAGENT_POSTGRES_DSN: postgresql+psycopg://archagent:archagent@postgres:5432/archagent
      ARCHAGENT_K8S_AUTO_MIGRATE: "true"
      ARCHAGENT_K8S_POLL_INTERVAL_SEC: "45"
      KUBECONFIG: /kube/config
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "agent.app.connectors.orchestrator"]
    volumes:
      - ${HOME}/.kube/config:/kube/config:ro
      - ${HOME}/.minikube:/Users/zain/.minikube:ro

  k8s-worker:
    profiles: ["connection-workers"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ARCHAGENT_POSTGRES_DSN: postgresql+psycopg://archagent:archagent@postgres:5432/archagent
      ARCHAGENT_K8S_AUTO_MIGRATE: "true"
      ARCHAGENT_K8S_POLL_INTERVAL_SEC: "45"
      KUBECONFIG: /kube/config
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "agent.app.connectors.kubernetes.worker"]
    volumes:
      - ${HOME}/.kube/config:/kube/config:ro
      - ${HOME}/.minikube:/Users/zain/.minikube:ro

  logs-worker:
    profiles: ["connection-workers"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ARCHAGENT_POSTGRES_DSN: postgresql+psycopg://archagent:archagent@postgres:5432/archagent
      ARCHAGENT_K8S_AUTO_MIGRATE: "true"
      ARCHAGENT_K8S_POLL_INTERVAL_SEC: "45"
      KUBECONFIG: /kube/config
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "agent.app.connectors.logs.worker"]
    volumes:
      - ${HOME}/.kube/config:/kube/config:ro
      - ${HOME}/.minikube:/Users/zain/.minikube:ro

volumes:
  postgres_data:
