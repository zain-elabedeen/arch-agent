name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test Alembic migrations
        run: |
          ARCHAGENT_PRODUCT_DATABASE_URL=sqlite:////tmp/archagent-migration.db python -m alembic upgrade head
          ARCHAGENT_PRODUCT_DATABASE_URL=sqlite:////tmp/archagent-migration.db python -m alembic current

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint collector Helm chart
        run: helm lint deploy/helm/archagent-collector --set image.tag=ci --set registration.token=ci-token

      - name: Build Docker image
        run: docker build --tag archi-agent:ci .
